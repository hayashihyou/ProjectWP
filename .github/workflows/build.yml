name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:            # ドキュメントだけの変更では回さない
      - '**.md'
      - 'docs/**'

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - Android
          - StandaloneOSX

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: ProjectWP/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('ProjectWP/Assets/**','ProjectWP/Packages/**','ProjectWP/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Free disk space
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@main

      - name: Build Windows
        if: matrix.targetPlatform == 'StandaloneWindows64'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ProjectWP
          targetPlatform: StandaloneWindows64
          versioning: Semantic

      - name: Build Android
        if: matrix.targetPlatform == 'Android'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ProjectWP
          targetPlatform: Android
          versioning: Semantic
          androidExportType: androidPackage      # apk。aab なら androidAppBundle
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Build OSX
        if: matrix.targetPlatform == 'StandaloneOSX'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          versioning: Tag

      - name: Archive (OSX)
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: tar -czf StandaloneOSX.tar.gz -C build StandaloneOSX

      - uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneOSX
          path: StandaloneOSX.tar.gz
          retention-days: 7
